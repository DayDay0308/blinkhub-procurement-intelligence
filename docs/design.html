<script>
const DOCS = {"architecture": "# BlinkHub Procurement Intelligence & Risk Engine: Solution Architecture\n\n> Candidate submission for the BlinkHub Procurement Innovation Challenge (MICS scenario).\n> All data is **fictional or synthetic, for demonstration only**. Results from synthetic data are never presented as MICS's real performance.\n\n## 1. Problem statement\n\nMICS spends **R85m a year** across 450 suppliers, but its procurement data is spread across spreadsheets, mailboxes and separate PO and invoice systems. In the sample data provided:\n\n- **3 large enterprises receive 84% of the listed spend**, while SMMEs receive 16%.\n- **5 of 8 invoices are outstanding past 30 days** (R955k). The SMMEs wait 38\u201347 days; large suppliers were paid in 8\u201315.\n- **2 invoices look like possible duplicates** (Thuto INV002/INV008; Ubuntu INV006 matches a PO that has already been paid).\n- **No invoice carries a PO reference**, so nothing can be matched automatically.\n\n**Chosen focus:** Problems 3, 4 and 6 (*Where is the money? The invoice that never gets paid. Something doesn't look right.*). Underneath, these are one problem: **no single, trustworthy view of the procure-to-pay chain**. Without it, money cannot be tracked, invoices cannot be paid on time, and risk cannot be caught.\n\n**Why these three:** they share one data spine (supplier \u2192 PO \u2192 goods receipt \u2192 invoice \u2192 payment), the sample data provides evidence for all three, and fixing them has a direct rand value: late-payment harm to SMMEs, duplicate payments, and leakage.\n\n## 2. Solution overview\n\nThree Blink modules on one PostgreSQL database:\n\n| Module | Business problem | What it does |\n|---|---|---|\n| **P2P Control** (invoice tracker) | P4, P2 | Suppliers submit invoices on a portal (finance captures emailed ones); 3-way match (PO \u2194 GRN \u2194 invoice); routing to one named approver; 20 / 25 / 30-day SLA ladder; suppliers see status and owner |\n| **Supplier Performance & Risk** | P1, P5, P6 | Onboarding checks and duplicate detection; compliance documents with expiry tracking, upload, automatic reading and verification; A\u2013E scorecards; explainable risk rules + anomaly model producing *flags for investigation* with evidence, assignment and case notes |\n| **Procurement Intelligence** | P3, P2 | Live dashboard and dbt marts \u2192 Power BI: spend by department/supplier/category/province, concentration (HHI), SMME and B-BBEE share, days-to-pay by supplier type. **Ask BlinkHub**: plain-English questions answered by one read-only SELECT over curated `ask` views, with the SQL shown |\n\n## 3. Architecture\n\n![Architecture: users, React frontend, FastAPI modules, Celery worker, PostgreSQL with ask views, document storage, dbt and Dagster to Power BI, optional Claude API](images/architecture.png)\n\n[Open as SVG](images/architecture.svg) (zoomable)\n\n<details>\n<summary>Diagram source (Mermaid)</summary>\n\n```mermaid\nflowchart TB\n  U[\"Users<br/>procurement, finance, approvers,<br/>managers, auditors, suppliers\"]\n\n  FE[\"Web app: React + TypeScript, served by nginx<br/>staff console and supplier portal\"]\n\n  subgraph Backend[\"Backend: FastAPI modular monolith\"]\n    AUTH[Auth & RBAC<br/>JWT, role guards]\n    INV[Invoice module<br/>3-way match, routing, SLA]\n    SUPM[Supplier & compliance module<br/>onboarding, documents, reading]\n    RISKAPI[Risk module<br/>flags, cases, scorecards]\n    ANA[Analytics API]\n    ASK[Ask BlinkHub<br/>guarded text-to-SQL]\n  end\n\n  W[\"Worker: Celery + Redis<br/>SLA check every 15 min, risk scan 02:00,<br/>compliance check 06:00\"]\n\n  subgraph Data[\"Data layer\"]\n    PG[(PostgreSQL 16<br/>core, p2p, compliance,<br/>sourcing, risk, audit)]\n    ASKV[(ask views<br/>read-only login)]\n    MARTS[(analytics schema<br/>dbt marts)]\n    DOCS[(Documents<br/>volume locally, S3 on AWS)]\n  end\n\n  subgraph Pipeline[\"Analytics pipeline\"]\n    DG[Dagster, daily 03:00]\n    DBT[dbt: staging to marts<br/>+ 40 data tests]\n  end\n\n  AI[Claude API<br/>optional, with fallbacks]\n\n  U --> FE --> AUTH\n  AUTH --> INV & SUPM & RISKAPI & ANA & ASK\n  INV & SUPM & RISKAPI & ANA --> PG\n  SUPM --> DOCS\n  SUPM -.-> AI\n  ASK -.-> AI\n  ASK --> ASKV --> PG\n  W --> PG\n  DG --> DBT --> MARTS\n  PG --> DBT\n  MARTS --> PBI[Power BI]\n```\n\n</details>\n\n### Key design decisions\n\n| Decision | Choice | Why | Trade-off accepted |\n|---|---|---|---|\n| Service shape | **Modular monolith** | One deployable unit is right for a prototype and a small team; module boundaries (invoice, supplier, risk, analytics) map to future services | Must scale as one unit; can split later along the same boundaries |\n| OLTP vs analytics | **Same Postgres, separate schemas** (`p2p` vs `analytics`) | Dashboards never compete with transactional tables; one database to operate | At real scale, move marts to a warehouse (e.g. Snowflake/BigQuery/DuckDB). dbt makes that a config change |\n| Transformations | **dbt** | Version-controlled SQL, tests (`unique`, `not_null`, relationships), lineage docs. Replaces \"monthly manual reports\" | Extra tool to learn; worth it for reliability |\n| Orchestration | **Dagster** | Asset-based: each mart is a visible asset with freshness checks | Airflow is more common; Dagster fits a data-asset model better |\n| Risk detection | **Rules first, ML second** | Rules are explainable and auditable (needed when people's reputations are involved); Isolation Forest catches patterns no rule anticipated | ML gives a score, not a reason, so every ML flag is paired with the features that drove it |\n| Duplicate invoices | **Prevent + detect** | Unique index on (supplier, normalised invoice no.) blocks exact repeats at submission; fuzzy rule catches near-duplicates (same amount, same PO, different number) | Fuzzy matches produce some false positives; that is why they go to review, not auto-rejection |\n| Audit | **Append-only, hash-chained log** in Postgres | Any edited or deleted history breaks the chain, so tampering is detectable (fraud context) | Not a blockchain; trust still rests on DB administrators |\n| Documents | **Files outside the database** (a Docker volume locally, encrypted S3 on AWS) + SHA-256 per file | DB stays small; identical re-uploads are blocked; S3 adds encryption and versioning | Two storage paths to test (both are) |\n| Sensitive data | Bank account numbers **encrypted**; UI shows last 4 digits only | POPIA; bank-detail fraud is a named risk | Key management is simplified in the prototype |\n\n## 4. Core business rules\n\n1. **3-way match:** an invoice moves to approval only if it references an approved PO, a goods receipt exists, and invoice amount \u2264 received amount (within a tolerance, default 2%). Otherwise \u2192 `EXCEPTION` with a reason.\n2. **Always an accountable owner:** every non-final invoice has a `current_approver_id`. Approval routes by department and the approver's `approval_limit`.\n3. **Payment SLA:** an invoice's due date defaults to 30 days from receipt. Escalation at day 20 (to the approver), day 25 (to the manager) and day 30 (breach, on the dashboard). SMME invoices get a priority flag.\n4. **Segregation of duties:** whoever raises a PO cannot approve it (enforced in the database); whoever changes bank details cannot release a payment within 72 hours of the change.\n5. **Compliance gate:** a supplier with an expired tax clearance or B-BBEE document cannot receive new POs (payment of existing work continues, so suppliers are not punished for admin lag).\n6. **Flags, not accusations:** risk output is always `OPEN` for review. Only a human can mark a flag `CONFIRMED` or `DISMISSED`, with a case note.\n\n## 5. Risk rules (explainable)\n\nImplemented in `backend/app/services/risk/`. Each rule is a single SQL query, with thresholds in `risk.rules.params`.\n\n| Code | Detects | Logic (summary) | Case-study link |\n|---|---|---|---|\n| `DUP_INVOICE` | Duplicate billing | Exact repeats are blocked at submission (unique index). Near-duplicates: same supplier and amount on the same PO; or one without a PO within 60 days; or different POs raised within 7 days (excludes recurring monthly contracts) | Thuto INV002/INV008, Ubuntu INV006 |\n| `SPLIT_THRESHOLD` | Orders split to avoid approval | 3+ orders, same supplier and department, within 30 days (by **PO date**), each at 90\u2013100% of an approval limit | \"Several payments just below threshold\" |\n| `NO_DELIVERY_EVIDENCE` | Paid without proof of delivery | Approved or paid invoice with no PO or no GRN | \"Paid despite incomplete delivery documentation\" |\n| `BANK_CHANGE_BEFORE_PAY` | Payment redirection | Paid into an account that replaced the previous one within 14 days | \"Banking details changed shortly before payment\" |\n| `QUOTE_SIMILARITY` | Collusion or cover pricing | 3+ quotes with coefficient of variation < 2% | \"Unusually similar pricing\" |\n| `CONCENTRATION` | Supplier dominance | Top supplier > 40% of a category's 12-month spend; HHI reported | \"Disproportionately large share\" |\n| `INCOMPLETE_COMPLIANCE` | Paying non-compliant suppliers | Active supplier paid in the last 90 days without a valid tax clearance | Path B Option 3 |\n| `ANOMALY_ML` | Unusual expenditure | Isolation Forest on amount vs supplier and category norms, volume, round amounts, weekend submission; each flag explained with robust z-scores | \"Unusual expenditure patterns\" |\n\n**Proving it works.** The synthetic generator plants labelled anomalies of each type and also includes legitimate look-alikes, such as monthly contracts billing identical amounts. `GET /risk/evaluation` reports precision and recall per rule:\n\n| Measure | Result |\n|---|---|\n| Overall recall | **99.2%** (123 of 124 planted anomalies caught) |\n| Overall precision | **about 89\u201390%** (92\u201393% counting real problems caught by another rule); moves slightly with the run date |\n| SQL rules | 95\u2013100% precision per rule |\n| ML | 58% precision: a second opinion |\n\n**Two refinements found through evaluation**, which make good talking points:\n1. Recurring monthly contracts made the duplicate rule fire, so it now compares how far apart the **POs** were raised.\n2. Late deliveries spread split orders apart in time, so the split rule now measures the window on **PO dates**, not invoice dates.\n\n## 5b. Supplier performance scorecard\n\nBlink's buyer module promises \"track supplier performance\", and the scorecard (`app/services/scorecard.py`) delivers it. Each supplier gets five KPIs, each scored from 0 to 100:\n\n| KPI | Weight | Measures |\n|---|---|---|\n| Delivery reliability | 30% | Received on or before the expected date |\n| Invoice accuracy | 25% | Has a PO, is within the PO value, not flagged as a duplicate or as having no delivery evidence |\n| Compliance | 20% | Valid, verified tax clearance and B-BBEE certificate; expiring within 30 days = 75 |\n| Risk record | 15% | Open or confirmed flags weighted by severity (concentration excluded, because it isn't misconduct) |\n| Price competitiveness | 10% | Unit prices against the market median for the same item code |\n\nKPIs without data are re-weighted. Suppliers with no activity are `N/A`, never ranked.\n\n## 6. Technology stack\n\n| Layer | Technology |\n|---|---|\n| Frontend | React 18, TypeScript, Vite, TanStack Query, React Router, Tailwind CSS 4, Recharts, lucide icons; served by nginx |\n| Backend | Python 3.12, FastAPI, Pydantic v2, SQLAlchemy 2, Alembic migrations |\n| Auth | JWT access tokens (60 minutes, HS256), Argon2id password hashes, role-based guards, supplier users scoped to their own supplier |\n| Database | PostgreSQL 16 (pgcrypto, pg_trgm) |\n| Async | Celery + Redis (SLA check every 15 minutes, risk scan 02:00, compliance check 06:00) |\n| Analytics | dbt-core (dbt-postgres), Dagster |\n| ML / AI | scikit-learn Isolation Forest + NumPy (risk); Claude API (optional, with rule-based fallbacks) for certificate reading and Ask BlinkHub |\n| Storage | Uploaded documents in a Docker volume locally, Amazon S3 (encrypted, versioned) on AWS |\n| Quality | pytest on real PostgreSQL (130 tests), Vitest, dbt tests (40), Ruff, `tsc` type checks, an end-to-end demo check script |\n| Delivery | Docker Compose (one command); GitHub Actions CI (backend, analytics, frontend, Docker) and a manual deploy using OIDC; Terraform for AWS (EC2, S3, IAM, budget) with Caddy HTTPS |\n| Observability | Structured JSON logs with request IDs, `/health` endpoint; CloudWatch metrics and alarms are a production next step |\n\n## 7. Roles and access\n\n| Role | Can |\n|---|---|\n| Supplier | Submit invoices; see only their own invoices, payments and documents |\n| Procurement Officer | Manage suppliers, POs, goods receipts; view risk flags |\n| Finance Officer / Approver | Approve or reject invoices within their limit; schedule payments |\n| Manager | All dashboards; reassign approvals; escalation target |\n| Auditor | Read-only everything, including the audit log and risk cases; update flag status |\n| Admin | Users, rules and thresholds |\n\n## 8. Delivery plan\n\nAll phases are done:\n\n| Phase | Scope |\n|---|---|\n| 1. Foundation | Repo, Docker Compose, schema + migrations, case-study seed, auth and roles, CI |\n| 2. Invoice tracker | Submission, 3-way match, approval routing, SLA scheduler, supplier status view |\n| 3. Risk engine | Rules, Isolation Forest, flags API, investigation queue, precision/recall evaluation, supplier scorecards, synthetic demo year |\n| 4. Spend intelligence | dbt marts + tests, Dagster, Power BI report, analysis notebook (Path B) |\n| 5. Web app | React staff console and supplier portal; supplier compliance documents |\n| 6. AI and cloud | Certificate reading, Ask BlinkHub, AWS deployment (Terraform, HTTPS, S3, OIDC deploy) |\n| 7. Presentation | Findings on the sample, live demo, limitations, next steps |\n\n## 9. Limitations and assumptions\n\n- The sample has no dates, PO references on invoices, GRNs or quotations, so the synthetic expansion invents these, and every such assumption is documented.\n- A 30-day payment standard is assumed (common practice and the PFMA norm for the public sector; MICS's actual terms are unknown).\n- Risk thresholds are starting values, to be tuned with MICS data and auditor feedback.\n- Not production-grade: no SSO, simplified key management, single-server deployment (the production design is in `aws-deployment.md`).\n- Opportunities (SMME marketplace) and contracts exist in the data model and seed data, but have no screens yet.\n", "erd": "# Entity Relationship Diagram\n\n21 tables in 6 PostgreSQL schemas. The full DDL is in [`backend/migrations/sql/0001_initial_schema.sql`](../backend/migrations/sql/0001_initial_schema.sql). Analytics marts (`analytics` schema) are generated by dbt and are not shown.\n\n![Entity relationship diagram of the BlinkHub database: suppliers, purchase orders, invoices, payments, compliance documents, risk flags, users and audit events](images/erd.png)\n\n[Open as SVG](images/erd.svg) (zoomable)\n\n<details>\n<summary>Diagram source (Mermaid)</summary>\n\n```mermaid\nerDiagram\n  DEPARTMENTS ||--o{ BUDGETS : \"has yearly\"\n  DEPARTMENTS ||--o{ USERS : employs\n  DEPARTMENTS ||--o{ PURCHASE_ORDERS : raises\n  DEPARTMENTS ||--o{ CONTRACTS : owns\n  DEPARTMENTS ||--o{ OPPORTUNITIES : publishes\n\n  CATEGORIES ||--o{ CATEGORIES : \"parent of\"\n  CATEGORIES ||--o{ PURCHASE_ORDERS : classifies\n  CATEGORIES ||--o{ SUPPLIER_CATEGORIES : \"\"\n  CATEGORIES ||--o{ OPPORTUNITIES : classifies\n\n  SUPPLIERS ||--o{ SUPPLIER_CATEGORIES : \"supplies in\"\n  SUPPLIERS ||--o{ USERS : \"portal users\"\n  SUPPLIERS ||--o{ DOCUMENTS : uploads\n  SUPPLIERS ||--o{ BANK_ACCOUNTS : \"has history of\"\n  SUPPLIERS ||--o{ CONTRACTS : holds\n  SUPPLIERS ||--o{ PURCHASE_ORDERS : receives\n  SUPPLIERS ||--o{ INVOICES : submits\n  SUPPLIERS ||--o{ QUOTATIONS : submits\n  SUPPLIERS ||--o{ FLAGS : \"subject of\"\n\n  CONTRACTS ||--o{ PURCHASE_ORDERS : \"draws down\"\n  PURCHASE_ORDERS ||--|{ PURCHASE_ORDER_LINES : contains\n  PURCHASE_ORDERS ||--o{ GOODS_RECEIPTS : \"received via\"\n  PURCHASE_ORDERS ||--o{ INVOICES : \"billed by\"\n  INVOICES ||--o{ INVOICE_APPROVALS : \"routed through\"\n  INVOICES ||--o{ PAYMENTS : \"settled by\"\n  BANK_ACCOUNTS ||--o{ PAYMENTS : \"paid into\"\n\n  OPPORTUNITIES ||--o{ QUOTATIONS : receives\n\n  RULES ||--o{ FLAGS : raises\n  FLAGS ||--o{ CASE_NOTES : \"investigated in\"\n  USERS ||--o{ CASE_NOTES : writes\n  USERS ||--o{ INVOICE_APPROVALS : decides\n  USERS ||--o{ AUDIT_EVENTS : performs\n\n  SUPPLIERS {\n    uuid id PK\n    varchar supplier_code UK\n    varchar legal_name\n    varchar registration_number UK \"CIPC: dedup key\"\n    varchar csd_number UK\n    enum province\n    enum supplier_type \"SMME / LARGE_ENTERPRISE\"\n    enum enterprise_size \"EME / QSE / GENERIC\"\n    smallint bbbee_level \"1-8, null = non-compliant\"\n    numeric black_owned_pct\n    numeric black_women_owned_pct\n    enum status\n  }\n  DOCUMENTS {\n    uuid id PK\n    uuid supplier_id FK\n    enum doc_type \"TAX_CLEARANCE, BBBEE_CERT...\"\n    char sha256 \"re-upload detection\"\n    date expiry_date\n    enum status\n    jsonb extracted_data \"document AI output\"\n  }\n  BANK_ACCOUNTS {\n    uuid id PK\n    uuid supplier_id FK\n    bytea account_number_enc \"encrypted (POPIA)\"\n    char account_last4\n    timestamptz effective_from\n    timestamptz effective_to \"null = current\"\n  }\n  CONTRACTS {\n    uuid id PK\n    varchar contract_number UK\n    uuid supplier_id FK\n    uuid department_id FK\n    numeric contract_value\n    date start_date\n    date end_date\n    enum status\n  }\n  PURCHASE_ORDERS {\n    uuid id PK\n    varchar po_number UK\n    uuid supplier_id FK\n    uuid department_id FK\n    uuid category_id FK\n    uuid contract_id FK \"nullable\"\n    numeric total_amount\n    uuid created_by FK\n    uuid approved_by FK \"must differ from created_by\"\n    enum status\n  }\n  PURCHASE_ORDER_LINES {\n    uuid id PK\n    uuid po_id FK\n    varchar item_code \"regional price comparison\"\n    numeric quantity\n    numeric unit_price\n    numeric line_total \"generated\"\n  }\n  GOODS_RECEIPTS {\n    uuid id PK\n    varchar grn_number UK\n    uuid po_id FK\n    date received_date\n    numeric amount_received\n    text evidence_key\n  }\n  INVOICES {\n    uuid id PK\n    uuid supplier_id FK\n    uuid po_id FK \"null = exception\"\n    varchar invoice_number\n    varchar invoice_number_norm \"UK with supplier_id\"\n    numeric amount\n    date invoice_date\n    date due_date\n    enum status \"state machine\"\n    uuid current_approver_id FK\n    timestamptz paid_at\n  }\n  INVOICE_APPROVALS {\n    uuid id PK\n    uuid invoice_id FK\n    smallint step\n    uuid approver_id FK\n    enum decision\n    timestamptz decided_at\n  }\n  PAYMENTS {\n    uuid id PK\n    uuid invoice_id FK\n    uuid bank_account_id FK\n    numeric amount\n    timestamptz paid_at\n  }\n  FLAGS {\n    uuid id PK\n    varchar rule_code FK\n    varchar entity_type\n    uuid entity_id\n    numeric score \"0-100\"\n    enum severity\n    jsonb explanation \"reason codes + evidence\"\n    enum status \"OPEN to CONFIRMED / DISMISSED\"\n    uuid assigned_to FK\n  }\n  RULES {\n    varchar code PK\n    enum severity\n    jsonb params \"tunable thresholds\"\n    boolean is_enabled\n  }\n  AUDIT_EVENTS {\n    bigint id PK\n    uuid actor_id FK\n    varchar action\n    jsonb before_state\n    jsonb after_state\n    char prev_hash\n    char hash \"sha256 chain\"\n  }\n  USERS {\n    uuid id PK\n    varchar email UK\n    enum role\n    uuid department_id FK\n    uuid supplier_id FK \"only for SUPPLIER role\"\n    numeric approval_limit\n  }\n  DEPARTMENTS {\n    uuid id PK\n    varchar code UK\n    varchar name\n  }\n  BUDGETS {\n    uuid id PK\n    uuid department_id FK\n    smallint fiscal_year\n    numeric amount\n  }\n  CATEGORIES {\n    uuid id PK\n    varchar code UK\n    uuid parent_id FK\n  }\n  OPPORTUNITIES {\n    uuid id PK\n    varchar reference UK\n    uuid category_id FK\n    numeric estimated_value\n    boolean smme_set_aside\n    timestamptz closes_at\n    enum status\n  }\n  QUOTATIONS {\n    uuid id PK\n    uuid opportunity_id FK\n    uuid supplier_id FK\n    numeric amount\n  }\n  CASE_NOTES {\n    uuid id PK\n    uuid flag_id FK\n    uuid author_id FK\n    text note\n  }\n  SUPPLIER_CATEGORIES {\n    uuid supplier_id PK\n    uuid category_id PK\n  }\n```\n\n</details>\n\n## Design notes\n\n| Feature | Business problem it solves |\n|---|---|\n| `registration_number`, `vat_number` and `csd_number` are unique; trigram index on `legal_name` | Duplicate supplier profiles (P1) |\n| `invoices.po_id` nullable, but a null PO sends the invoice to `EXCEPTION` | Invoices missing PO references (P4) |\n| Unique `(supplier_id, invoice_number_norm)`: normalisation strips spaces and dashes, so `INV-001` = `inv 001` | Duplicate invoices (P4, P6) |\n| `current_approver_id` on every open invoice | \"Finance cannot determine who is responsible\" (P4) |\n| `goods_receipts` table | 3-way match; payment without delivery evidence (P6) |\n| `bank_accounts` keeps history (`effective_from` / `effective_to`) | Bank details changed before payment (P6) |\n| `purchase_order_lines.item_code` | Paying different prices for the same item across regions (P3) |\n| `contracts.contract_value` + POs linked to contracts | Spend against contract, expiry tracking (P5) |\n| `opportunities.smme_set_aside` + `quotations` | SMME access (P2); quote-similarity detection (P6) |\n| `risk.flags` unique per (rule, entity) | Re-running the engine never duplicates flags |\n| `audit.events` append-only and hash-chained | Tamper-evident history for investigations |\n| `CHECK (approved_by <> created_by)` | Segregation of duties enforced by the database, not just the UI |\n\n## Added in later migrations\n\n| Migration | Change | Why |\n|---|---|---|\n| 0002 | `p2p.invoices.match_exceptions text[]` | Stores the 3-way-match result (e.g. `AWAITING_GOODS_RECEIPT`) |\n| 0002 | `core.notifications` (unique per user + kind + entity) | In-app alerts; the SLA job can re-run without spamming |\n| 0003 | `p2p.purchase_orders.expected_delivery_date` | Delivery-reliability KPI |\n| 0003 | `risk.flags.last_seen_at`, `resolved_by`; seeded `risk.rules` with tunable `params` | Engine bookkeeping; thresholds changeable without a deploy |\n| 0003 | `synthetic.anomaly_labels` (separate schema) | Answer key for planted anomalies in the demo data, so precision and recall can be measured. Kept apart from operational data |\n| 0004 | `compliance.documents.uploaded_by`, `original_filename`, `content_type`, `size_bytes`, `rejection_reason`; unique (supplier, file hash) | Traceable uploads, reasons suppliers can act on, no duplicate files |\n"};
