name: blinkhub
version: "1.0.0"
profile: blinkhub
config-version: 2

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  blinkhub:
    staging:
      +schema: staging        # light cleaning, one view per source table
      +materialized: view
    marts:
      +schema: analytics      # star schema for Power BI and the API
      +materialized: table

vars:
  payment_terms_days: 30
