# BlinkHub Procurement Intelligence — local stack
#   docker compose up --build
#   API docs: http://localhost:8000/docs
# Services: db (PostgreSQL), redis (queue), api (FastAPI), worker (Celery + beat: SLA checks, nightly risk scan),
#           dagster (dbt analytics marts for Power BI, UI on http://localhost:3000)

name: blinkhub

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: blinkhub
      POSTGRES_USER: ${POSTGRES_USER:-blinkhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-blinkhub}
    ports:
      - "${DB_PORT:-5432}:5432"   # host port for Power BI / DBeaver; set DB_PORT in .env if 5432 is taken
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d blinkhub"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment: &app-env
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-blinkhub}:${POSTGRES_PASSWORD:-blinkhub}@db:5432/blinkhub
      ENVIRONMENT: ${ENVIRONMENT:-local}
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me-0123456789}
      SEED_ON_START: ${SEED_ON_START:-true}
      SEED_SYNTHETIC: ${SEED_SYNTHETIC:-true}   # generate the demo year (synthetic, labelled)
      DEMO_PASSWORD: ${DEMO_PASSWORD:-Demo@2026!}
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:8080"]'
      REDIS_URL: redis://redis:6379/0
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:-local-dev-data-key-change-me}
      SLA_CHECK_MINUTES: ${SLA_CHECK_MINUTES:-15}
      DOCUMENT_DIR: /data/documents
      DOCUMENT_BUCKET: ${DOCUMENT_BUCKET:-}          # set on AWS: documents go to S3
      AWS_DEFAULT_REGION: ${AWS_REGION:-af-south-1}
      ASK_DB_PASSWORD: ${ASK_DB_PASSWORD:-ask-local-dev-password}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}      # optional: AI certificate reading + Ask BlinkHub
      AI_MODEL: ${AI_MODEL:-claude-haiku-5-5}
    volumes:
      - documents:/data/documents   # uploaded supplier documents (S3 on AWS)
    ports:
      - "8000:8000"
    restart: unless-stopped

  worker:
    build: ./backend
    # Runs scheduled jobs: payment-SLA check, 02:00 risk scan, 06:00 compliance check.
    entrypoint: ["celery", "-A", "app.worker", "worker", "--beat", "--loglevel=info",
                 "--schedule=/tmp/celerybeat-schedule"]
    depends_on:
      api:
        condition: service_healthy
    environment:
      <<: *app-env
      SEED_ON_START: "false"
    restart: unless-stopped

  dagster:
    build: ./analytics
    # Builds the analytics marts (dbt) on start, then serves Dagster on :3000.
    # Schedule: daily at 03:00, after the worker's 02:00 risk scan.
    depends_on:
      api:
        condition: service_healthy
    environment:
      DBT_HOST: db
      DBT_PORT: "5432"
      DBT_USER: ${POSTGRES_USER:-blinkhub}
      DBT_PASSWORD: ${POSTGRES_PASSWORD:-blinkhub}
      DBT_DBNAME: blinkhub
    ports:
      - "3000:3000"
    restart: unless-stopped

  web:
    build: ./frontend
    # React app on nginx; /api is proxied to the api service.
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  pgdata:
  documents:
